name: Build and Push Images

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: registry.stoneycroft.leewinter.net
  NAMESPACE: edu-stats
  TAG_SHA: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/api:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/api:${{ env.TAG_SHA }}

      - name: Build and push api-migrator
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/api-migrator:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/api-migrator:${{ env.TAG_SHA }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/web:${{ env.TAG_SHA }}
